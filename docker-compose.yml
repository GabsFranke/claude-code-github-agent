services:
  redis:
    image: redis:7-alpine
    env_file: .env
    command: sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  webhook:
    build:
      context: .
      dockerfile: services/webhook/Dockerfile
    command: sh -c 'python main.py 2>&1 | tee /var/log/bot/webhook.log'
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/bot
    ports:
      - "10000:8080"
    environment:
      - PYTHONPATH=/app
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - QUEUE_TYPE=redis
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: services/agent_worker/Dockerfile
    command: sh -c 'python3 -m services.agent_worker.worker 2>&1 | tee /var/log/bot/worker.log'
    env_file: .env
    restart: unless-stopped
    volumes:
      # Claude home — read-only access to memory
      - ~/.claude:/home/bot/.claude:ro
      - ./logs:/var/log/bot
    environment:
      - PYTHONPATH=/app
      # Worker creates jobs in queue (lightweight coordinator)
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - QUEUE_TYPE=redis
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Session streaming URL (for live-view links in GitHub comments)
      - SESSION_PROXY_URL=${SESSION_PROXY_URL:-http://localhost:10001}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  sandbox_worker:
    build:
      context: .
      dockerfile: services/sandbox_executor/Dockerfile
    entrypoint: ["/app/entrypoint.sh"]
    command: sh -c '(socat TCP-LISTEN:18000,fork TCP:mcp_proxy:18000 >/dev/null 2>&1 &) && python -m services.sandbox_executor.sandbox_worker 2>&1 | tee /var/log/bot/sandbox_worker.log'
    env_file: .env
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      # Persistent cache for bare repositories across all workers
      - repo-cache:/var/cache/repos:rw
      # Claude home — bind-mounted from host ~/.claude/ for CLI-friendly sessions
      - ~/.claude:/home/bot/.claude:rw
      - ~/.claude.json:/home/bot/.claude.json:rw
      - ./logs:/var/log/bot
      # gcloud credentials for Vertex AI — sandbox is the one calling the SDK
      # Mounted to bot user's home directory
      - ${APPDATA}/gcloud/application_default_credentials.json:/home/bot/.config/gcloud/application_default_credentials.json:ro
    environment:
      - PYTHONPATH=/app
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL}
      - ANTHROPIC_VERTEX_PROJECT_ID=${ANTHROPIC_VERTEX_PROJECT_ID}
      - ANTHROPIC_VERTEX_REGION=${ANTHROPIC_VERTEX_REGION}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=http://langfuse:3000
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SDK_DEBUG=${SDK_DEBUG:-false}
      - CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=${CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS:-0}
      - ALLOW_HOST_MCP=${ALLOW_HOST_MCP:-true}
      - ENABLE_BUILTIN_PLUGINS=${ENABLE_BUILTIN_PLUGINS:-false}
      - MEMORY_WORKER_REPLICAS=${MEMORY_WORKER_REPLICAS:-0}
      - RETROSPECTOR_REPLICAS=${RETROSPECTOR_REPLICAS:-0}
      # Custom API port forwarding (socat: localhost:PORT → host.docker.internal:PORT)
      - SOCAT_API_FORWARD=${SOCAT_API_FORWARD:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp_proxy:
    build:
      context: .
      dockerfile: services/mcp_proxy/Dockerfile
    command: sh -c '(socat TCP-LISTEN:11434,fork TCP:host.docker.internal:11434 >/dev/null 2>&1 &) && uvicorn services.mcp_proxy.main:app --host 0.0.0.0 --port 18000 2>&1 | tee /var/log/bot/mcp_proxy.log'
    env_file:
      - .env
      # Internal service secrets. Deliberately NOT in .env: sandbox_worker
      # loads .env wholesale, and the agent running there has Bash, so any
      # secret in .env is readable by the prompt-injected agent these secrets
      # defend against. Only the services that must hold them read this file.
      - path: .env.internal
        required: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:18000"
    volumes:
      - repo-cache:/var/cache/repos:rw
      - ~/.claude:/home/bot/.claude:rw
      - ./logs:/var/log/bot
    environment:
      - PYTHONPATH=/app
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  memory_worker:
    # 0 replicas means no container is created at all. The same number gates
    # the Stop hooks in sandbox_worker, so a worker that is not running also
    # has nothing queued for it. `make up MEMORY=2` overrides it for a run.
    scale: ${MEMORY_WORKER_REPLICAS:-0}
    build:
      context: .
      dockerfile: services/memory_worker/Dockerfile
    command: sh -c '(socat TCP-LISTEN:11434,fork TCP:host.docker.internal:11434 >/dev/null 2>&1 &) && (socat TCP-LISTEN:18000,fork TCP:mcp_proxy:18000 >/dev/null 2>&1 &) && ([ -z "$${SOCAT_API_FORWARD}" ] || socat TCP-LISTEN:$${SOCAT_API_FORWARD},fork TCP:host.docker.internal:$${SOCAT_API_FORWARD} >/dev/null 2>&1 &) && python -m services.memory_worker.memory_worker 2>&1 | tee /var/log/bot/memory_worker.log'
    env_file: .env
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      # Claude home — reads transcripts, writes memory files
      - ~/.claude:/home/bot/.claude:rw
      - ~/.claude.json:/home/bot/.claude.json:rw
      - ./logs:/var/log/bot
      # gcloud credentials for Vertex AI (if using Vertex backend)
      - ${APPDATA}/gcloud/application_default_credentials.json:/home/bot/.config/gcloud/application_default_credentials.json:ro
    environment:
      - PYTHONPATH=/app
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL}
      - MEMORY_WORKER_REPLICAS=${MEMORY_WORKER_REPLICAS:-0}
      - MEMORY_WORKER_MODEL=${MEMORY_WORKER_MODEL:-haiku}
      - ANTHROPIC_VERTEX_PROJECT_ID=${ANTHROPIC_VERTEX_PROJECT_ID}
      - ANTHROPIC_VERTEX_REGION=${ANTHROPIC_VERTEX_REGION}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=http://langfuse:3000
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_SESSION_PERSIST=${WORKER_SESSION_PERSIST:-true}
      # Custom API port forwarding
      - SOCAT_API_FORWARD=${SOCAT_API_FORWARD:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q worker || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  retrospector_worker:
    # See memory_worker above: 0 means no container, not an idle one.
    scale: ${RETROSPECTOR_REPLICAS:-0}
    build:
      context: .
      dockerfile: services/retrospector_worker/Dockerfile
    command: sh -c '(socat TCP-LISTEN:11434,fork TCP:host.docker.internal:11434 >/dev/null 2>&1 &) && (socat TCP-LISTEN:18000,fork TCP:mcp_proxy:18000 >/dev/null 2>&1 &) && ([ -z "$${SOCAT_API_FORWARD}" ] || socat TCP-LISTEN:$${SOCAT_API_FORWARD},fork TCP:host.docker.internal:$${SOCAT_API_FORWARD} >/dev/null 2>&1 &) && python -m services.retrospector_worker.retrospector_worker 2>&1 | tee /var/log/bot/retrospector_worker.log'
    env_file: .env
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      # Claude home — reads transcripts
      - ~/.claude:/home/bot/.claude:rw
      - ~/.claude.json:/home/bot/.claude.json:rw
      # Bare repo cache — needed to create worktrees of the bot repo
      - repo-cache:/var/cache/repos:rw
      - ./logs:/var/log/bot
      # gcloud credentials for Vertex AI (if using Vertex backend)
      - ${APPDATA}/gcloud/application_default_credentials.json:/home/bot/.config/gcloud/application_default_credentials.json:ro
    environment:
      - PYTHONPATH=/app
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL}
      - RETROSPECTOR_REPLICAS=${RETROSPECTOR_REPLICAS:-0}
      - RETROSPECTOR_MODEL=${RETROSPECTOR_MODEL:-sonnet}
      - ANTHROPIC_VERTEX_PROJECT_ID=${ANTHROPIC_VERTEX_PROJECT_ID}
      - ANTHROPIC_VERTEX_REGION=${ANTHROPIC_VERTEX_REGION}
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_HOOK_TIMEOUT=${LANGFUSE_HOOK_TIMEOUT:-30}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_SESSION_PERSIST=${WORKER_SESSION_PERSIST:-true}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      # Custom API port forwarding
      - SOCAT_API_FORWARD=${SOCAT_API_FORWARD:-}
      # The bot's own repository — retrospector opens PRs here
      - BOT_REPO=${BOT_REPO:-your-org/claude-code-github-agent}
      - BOT_USERNAME=${BOT_USERNAME:-Claude Code Agent}
      - BOT_USER_EMAIL=${BOT_USER_EMAIL:-claude-code-agent[bot]@users.noreply.github.com}
    depends_on:
      redis:
        condition: service_healthy
      repo_sync:
        condition: service_healthy

  repo_sync:
    build:
      context: .
      dockerfile: services/repo_sync/Dockerfile
    command: sh -c 'python -m services.repo_sync.sync_worker 2>&1 | tee /var/log/bot/repo_sync.log'
    env_file: .env
    restart: unless-stopped
    volumes:
      - repo-cache:/var/cache/repos:rw
      - ./logs:/var/log/bot
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # GitHub App credentials for cloning private repos when token not provided
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  session-service:
    build:
      context: .
      dockerfile: services/session_service/Dockerfile
    command: sh -c 'uvicorn services.session_service.main:app --host 0.0.0.0 --port 8000 2>&1 | tee /var/log/bot/session_service.log'
    env_file: .env
    restart: unless-stopped
    ports:
      # Loopback-only: the session UI and its WebSocket carry no authentication,
      # so the host is the trust boundary (see docs/SECURITY.md). Use an SSH
      # tunnel to reach it from another machine rather than widening this.
      - "127.0.0.1:10001:8000"
    volumes:
      - ~/.claude:/home/bot/.claude:ro
      - ./logs:/var/log/bot
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:10001}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    # See the note on mcp_proxy: internal secrets stay out of .env so the
    # sandbox agent's environment never contains them.
    env_file:
      - path: .env.internal
        required: false
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/bot
      # workflows.yaml is gitignored and absent from a clean clone. With the
      # short syntax the Docker daemon would create an empty DIRECTORY at
      # ./workflows.yaml on the host, shadowing the Dockerfile's example-file
      # fallback, crash-looping the scheduler on IsADirectoryError, and
      # leaving a stray directory that breaks later builds of the other
      # services. create_host_path: false makes the mount fail loudly instead.
      # Set WORKFLOWS_FILE to mount a config from elsewhere.
      - type: bind
        source: ${WORKFLOWS_FILE:-./workflows.yaml}
        target: /app/workflows.yaml
        read_only: true
        bind:
          create_host_path: false
    environment:
      - PYTHONPATH=/app
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=8082
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # /health now reports 503 until the scheduler has connected to Redis and
      # set _running, so boot needs a grace window or a slow Redis marks the
      # container unhealthy during normal startup.
      start_period: 15s

volumes:
  repo-cache:
  redis-data:
